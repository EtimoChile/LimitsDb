tables:
  - source_owner: GL
    history_owner: GL
    table_name: INV_HEAD
    frecuency: D
    hint_expr: full(A)
    conds:
      - is_active: true
        months_keep_prod: 3
        months_keep_hist: 11
        purge_limit_date_expr: "@INV_DSP_DATE"
        additional_expr: "@INV_STATUS='D'"
      - is_active: true
        months_keep_prod: 1
        months_keep_hist: 0
        purge_limit_date_expr: "@INVD_DATE"
        additional_expr: "@INV_STATUS='A'"
  - source_owner: GL
    history_owner: GL
    table_name: INV_DET
    frecuency: D
    hint_expr: full(A) full(B) use_hash(A, B)
    history_hint_expr: full(A)
    ref_tables: INV_HEAD B
    join_expr: "@ JOIN INV_HEAD B ON B.INV_ID=A.INV_ID"
    source_orphan_purge: true
    orphan_chk_column: B.INV_ID
    # conds:
    #   - is_active: true
  - source_owner: GL
    history_owner: GL
    table_name: DSP_HEAD
    frecuency: D
    hint_expr: full(A)
    conds:
      - is_active: true
        months_keep_prod: 3
        months_keep_hist: 0
        purge_limit_date_expr: "@DSP_DATE"
        additional_expr: "@DSP_STATUS='D'"
      - is_active: true
        months_keep_prod: 1
        months_keep_hist: 0
        purge_limit_date_expr: "@DSP_DATE"
        additional_expr: "@DSP_STATUS='A'"
  - source_owner: GL
    history_owner: GL
    table_name: DSP_DET
    frecuency: D
    hint_expr: full(A) full(B) full(C) use_hash(A, B, C)
    history_hint_expr: full(A)
    ref_tables: DSP_HEAD B, INV_DET C, INV_HEAD D
    join_expr: "@ JOIN DSP_HEAD B ON B.DSP_ID=A.DSP_ID @ JOIN INV_DET C ON C.IND_ID = A.IND_ID @ JOIN INV_HEAD D.INV_ID= C.INV_ID"
    source_orphan_purge: true
    orphan_chk_column: B.DSP_ID, C.IND_ID
    has_lob: true
    conds:
      # - is_active: true
