[project]
name = "terminusdb"
version = "0.5.0"
description = "Do configuration-based ILM to a production and history DB"
authors = [{ name = "Gustavo Cantizano", email = "gustavo.cantizano@etimo.cl" }]
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12,<4.0"

# Include template/resource files in both wheel and sdist distributions
dynamic = []
# You can include all non-Python files you want distributed:
include = ["terminusdb/resources/*"]

dependencies = [
  "oracledb>=2.5.1,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "cryptography>=46.0.2,<47.0.0",
  "platformdirs>=4.5.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
  "flake8>=7.1.1",
  "mypy>=1.14.1",
  "yapf>=0.40.2",
]

[project.scripts]
tdb-run = "terminusdb.cli.tdb_run:run_cli"
tdb-init = "terminusdb.cli.tdb_init:run_cli"
tdb-crypt = "terminusdb.cli.tdb_crypt:run_cli"
tdb-impl = "terminusdb.cli.tdb_impl:run_cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.yapf]
based_on_style = "pep8"
column_limit = 150
coalesce_brackets = true
dedent_closing_brackets = true
join_multiple_lines = true
split_before_first_argument = false
split_before_named_assigns = false
split_all_comma_separated_values = false
split_arguments_when_comma_terminated = false
blank_lines_around_top_level_definition = 1
blank_line_before_nested_class_or_def = false
split_penalty_after_opening_bracket = 1000
split_penalty_for_added_line_split = 1000
disable_ending_comma_heuristic = true

[tool.flake8]
max-line-length = 150
ignore = ["E203", "W503"]

[tool.mypy]
strict = true
