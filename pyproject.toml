[project]
name = "limitsdb"
version = "0.5.0"
description = "Configuration-driven ILM (Information Lifecycle Management) for production and history databases"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { file = "LICENSE" }

authors = [
  { name = "Gustavo Cantizano", email = "gustavo.cantizano@etimo.cl" }
]

maintainers = [
  { name = "Inversiones Etimo SpA", email = "contacto@etimo.cl" }
]

keywords = ["database", "oracle", "ilm", "data lifecycle", "archiving"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Database",
  "Topic :: System :: Systems Administration",
]

dependencies = [
  "oracledb>=2.5.1,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "cryptography>=46.0.2,<47.0.0",
  "platformdirs>=4.5.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/etimochile/limitsdb"
Repository = "https://github.com/etimochile/limitsdb"
Issues = "https://github.com/etimochile/limitsdb/issues"

[tool.poetry]
# You can include all non-Python files you want distributed:
include = [
  { path = "limitsdb/resources/*.yml", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.8.0"
flake8 = "^7.1.1"
mypy = "^1.14.1"
yapf = "^0.40.2"
pytest = "^8.3.0"
coverage = "^7.6.0"
twine = "^6.2.0"

[project.scripts]
ldb-run = "limitsdb.cli.ldb_run:run_cli"
ldb-init = "limitsdb.cli.ldb_init:run_cli"
ldb-crypt = "limitsdb.cli.ldb_crypt:run_cli"
ldb-impl = "limitsdb.cli.ldb_impl:run_cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.yapf]
based_on_style = "pep8"
column_limit = 150
coalesce_brackets = true
dedent_closing_brackets = true
join_multiple_lines = false
split_before_first_argument = true
split_before_named_assigns = false
split_all_comma_separated_values = false
split_arguments_when_comma_terminated = false
blank_lines_around_top_level_definition = 1
blank_line_before_nested_class_or_def = false
split_penalty_after_opening_bracket = 300
split_penalty_for_added_line_split = 300
disable_ending_comma_heuristic = true
indent_width = 4
continuation_indent_width = 4
align_closing_bracket_with_visual_indent = false

[tool.mypy]
strict = true
packages = ["limitsdb"]
exclude = "^tests/"

# para las libs externas sin stubs:
[[tool.mypy.overrides]]
module = [
  "pytest",
  "yaml",
  "cryptography.*",
  "platformdirs",
  "oracledb",
]
ignore_missing_imports = true
