[project]
name = "terminusdb"
version = "0.1.0"
description = "Do configuration based ILM to a production and history DB"
authors = [
    {name = "Gustavo Cantizano",email = "gustavo.cantizano@etimo.cl"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "oracledb (>=2.5.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.1"
mypy = "^1.14.1"
black = "^24.10.0"

[tool.poetry.scripts]
terminusdb = "terminusdb.cli.main:run_cli"

