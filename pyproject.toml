[project]
name = "limitsdb"
version = "0.5.0"
description = "Configuration-driven ILM (Information Lifecycle Management) for production and history databases"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { file = "LICENSE" }

authors = [
  { name = "Gustavo Cantizano", email = "gustavo.cantizano@etimo.cl" }
]

maintainers = [
  { name = "Inversiones Etimo SpA", email = "contacto@etimo.cl" }
]

keywords = ["database", "oracle", "ilm", "data lifecycle", "archiving"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Database",
  "Topic :: System :: Systems Administration",
]

dependencies = [
  "oracledb>=2.5.1,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "cryptography>=46.0.2,<47.0.0",
  "platformdirs>=4.5.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/etimochile/limitsdb"
Repository = "https://github.com/etimochile/limitsdb"
Issues = "https://github.com/etimochile/limitsdb/issues"

[tool.poetry]
# You can include all non-Python files you want distributed:
include = [
  { path = "limitsdb/resources/*.yml", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.8.0"
mypy = "^1.14.1"
ruff = "^0.16.10"
pytest = "^8.3.0"
coverage = "^7.6.0"
twine = "^6.2.0"

[project.scripts]
ldb-run = "limitsdb.cli.ldb_run:run_cli"
ldb-init = "limitsdb.cli.ldb_init:run_cli"
ldb-crypt = "limitsdb.cli.ldb_crypt:run_cli"
ldb-impl = "limitsdb.cli.ldb_impl:run_cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
strict = true
packages = ["limitsdb"]
exclude = "^tests/"

[tool.pytest.ini_options]
addopts = "-m 'not oracle_integration'"
markers = [
  "oracle_integration: requires an explicitly configured disposable Oracle database",
]

[tool.coverage.run]
source = ["limitsdb"]
branch = true
relative_files = true
parallel = true
concurrency = ["multiprocessing"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true

# para las libs externas sin stubs:
[[tool.mypy.overrides]]
module = [
  "pytest",
  "yaml",
  "cryptography.*",
  "platformdirs",
  "oracledb",
]
ignore_missing_imports = true
