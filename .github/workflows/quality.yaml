name: Quality

on:
  workflow_dispatch:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.5.1"

      - name: Install project and development dependencies
        run: poetry install --with dev --no-interaction

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

      - name: Type-check
        run: poetry run mypy limitsdb

      - name: Test
        run: poetry run pytest

      - name: Verify pre-commit hooks
        run: poetry run pre-commit run --all-files

      - name: Build distributions
        run: poetry build

      - name: Check distributions
        run: poetry run twine check dist/*

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "import limitsdb"
