name: CI

on:
  workflow_dispatch:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.5.1"

      - name: Install project and development dependencies
        run: poetry install --with dev --no-interaction

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

      - name: Type-check
        run: poetry run mypy limitsdb

      - name: Run unit tests with coverage
        run: |
          mkdir -p .coverage-data/unit
          COVERAGE_FILE=.coverage-data/unit/.coverage poetry run coverage run -m pytest -q

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ github.run_id }}
          path: .coverage-data/unit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Verify pre-commit hooks
        run: poetry run pre-commit run --all-files

      - name: Build distributions
        run: poetry build

      - name: Check distributions
        run: poetry run twine check dist/*

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "import limitsdb"

  oracle-integration:
    needs: quality
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      ORACLE_IMAGE: ghcr.io/gvenzl/oracle-free:23.26.3-faststart
      LDB_ORACLE_TEST_DSN: localhost:1521/FREEPDB1
      LDB_ORACLE_TEST_USER: system
      LDB_ORACLE_TEST_CONTAINER: limitsdb-oracle

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.5.1"

      - name: Install project and development dependencies
        run: poetry install --with dev --no-interaction

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage-${{ github.run_id }}
          path: .coverage-data/unit

      - name: Generate ephemeral Oracle password
        shell: bash
        run: |
          oracle_password="LdbCI_$(openssl rand -hex 16)"
          echo "::add-mask::$oracle_password"
          echo "ORACLE_PASSWORD=$oracle_password" >> "$GITHUB_ENV"
          echo "LDB_ORACLE_TEST_PASSWORD=$oracle_password" >> "$GITHUB_ENV"

      - name: Pull Oracle Free image
        shell: bash
        run: |
          started_at=$SECONDS
          docker pull "$ORACLE_IMAGE"
          echo "Oracle image pull: $((SECONDS - started_at)) seconds"
          docker image inspect "$ORACLE_IMAGE" --format 'Oracle image size: {{.Size}} bytes'
          df -h /

      - name: Start ephemeral Oracle
        shell: bash
        run: |
          started_at=$SECONDS
          docker run --detach --name limitsdb-oracle \
            --publish 1521:1521 \
            --env "ORACLE_PASSWORD=$ORACLE_PASSWORD" \
            "$ORACLE_IMAGE"
          echo "Oracle container launch: $((SECONDS - started_at)) seconds"

      - name: Wait for Oracle
        shell: bash
        run: |
          poetry run python - <<'PY'
          import os
          import time

          import oracledb

          deadline = time.monotonic() + 600
          last_error = None
          while time.monotonic() < deadline:
              try:
                  connection = oracledb.connect(
                      user=os.environ["LDB_ORACLE_TEST_USER"],
                      password=os.environ["LDB_ORACLE_TEST_PASSWORD"],
                      dsn=os.environ["LDB_ORACLE_TEST_DSN"],
                  )
                  connection.close()
                  print("Oracle is accepting connections")
                  break
              except oracledb.Error as exc:
                  last_error = exc
                  time.sleep(5)
          else:
              raise SystemExit(f"Oracle did not become ready within 600 seconds: {last_error}")
          PY

      - name: Report Oracle resources
        shell: bash
        run: |
          docker stats limitsdb-oracle --no-stream
          df -h /

      - name: Run Oracle integration tests with coverage
        shell: bash
        run: COVERAGE_FILE=.coverage-data/oracle/.coverage poetry run coverage run -m pytest -m oracle_integration -q

      - name: Build combined coverage report
        shell: bash
        run: |
          poetry run coverage combine .coverage-data/unit .coverage-data/oracle
          poetry run coverage report -m | tee coverage.txt
          poetry run coverage xml -o coverage.xml
          poetry run coverage html -d htmlcov

          {
            echo "### Combined unit and Oracle E2E coverage"
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-${{ github.run_id }}
          path: |
            .coverage
            coverage.txt
            coverage.xml
            htmlcov/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Show Oracle logs on failure
        if: failure()
        run: docker logs --tail 300 limitsdb-oracle

      - name: Remove ephemeral Oracle
        if: always()
        run: docker rm --force limitsdb-oracle || true

  postgres-integration:
    needs: quality
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      # The oldest supported release: the adapter promises PostgreSQL 9.5 or later
      POSTGRES_IMAGE: postgres:9.5
      LDB_PG_TEST_HOST: localhost:5432
      LDB_PG_TEST_USER: postgres
      LDB_PG_TEST_CONTAINER: limitsdb-postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.5.1"

      - name: Install project and development dependencies
        run: poetry install --with dev --no-interaction

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage-${{ github.run_id }}
          path: .coverage-data/unit

      - name: Generate ephemeral PostgreSQL password
        shell: bash
        run: |
          postgres_password="LdbCI_$(openssl rand -hex 16)"
          echo "::add-mask::$postgres_password"
          echo "POSTGRES_PASSWORD=$postgres_password" >> "$GITHUB_ENV"
          echo "LDB_PG_TEST_PASSWORD=$postgres_password" >> "$GITHUB_ENV"

      - name: Start ephemeral PostgreSQL
        shell: bash
        run: |
          docker run --detach --name "$LDB_PG_TEST_CONTAINER" \
            --publish 5432:5432 \
            --env "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            "$POSTGRES_IMAGE"

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          poetry run python - <<'PY'
          import os
          import time

          import pg8000.dbapi

          deadline = time.monotonic() + 120
          last_error = None
          while time.monotonic() < deadline:
              try:
                  connection = pg8000.dbapi.connect(
                      host="localhost",
                      port=5432,
                      database="postgres",
                      user=os.environ["LDB_PG_TEST_USER"],
                      password=os.environ["LDB_PG_TEST_PASSWORD"],
                  )
                  connection.close()
                  print("PostgreSQL is accepting connections")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"PostgreSQL did not become ready within 120 seconds: {last_error}")
          PY

      - name: Run PostgreSQL integration tests with coverage
        shell: bash
        run: COVERAGE_FILE=.coverage-data/postgres/.coverage poetry run coverage run -m pytest -m postgres_integration -q

      - name: Build combined coverage report
        shell: bash
        run: |
          poetry run coverage combine .coverage-data/unit .coverage-data/postgres
          {
            echo "### Combined unit and PostgreSQL E2E coverage"
            echo '```text'
            poetry run coverage report -m
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker logs --tail 300 "$LDB_PG_TEST_CONTAINER"

      - name: Remove ephemeral PostgreSQL
        if: always()
        run: docker rm --force "$LDB_PG_TEST_CONTAINER" || true
