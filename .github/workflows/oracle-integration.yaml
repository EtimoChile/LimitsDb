name: Oracle Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [development, main]
    paths:
      - ".github/workflows/oracle-integration.yaml"
      - "limitsdb/core/ldb_runner.py"
      - "limitsdb/db/ldb_engines.py"
      - "limitsdb/db/oracle/**"
      - "tests/integration/**"
      - "pyproject.toml"
      - "poetry.lock"

permissions: {}

concurrency:
  group: oracle-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      # gvenzl/oracle-free:23.26.2-slim-faststart, pinned to an immutable multi-platform digest.
      ORACLE_IMAGE: ghcr.io/gvenzl/oracle-free@sha256:5e340d72c5cd93b5ce8bab6c128b8f37a5ec485d5d9d98dc2cdc5353fe640f96
      LDB_ORACLE_TEST_DSN: localhost:1521/FREEPDB1
      LDB_ORACLE_TEST_USER: system

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.5.1"

      - name: Install project and development dependencies
        run: poetry install --with dev --no-interaction

      - name: Run local tests with coverage
        shell: bash
        run: |
          poetry run coverage erase
          mkdir -p .coverage-data/local .coverage-data/oracle
          COVERAGE_FILE=.coverage-data/local/.coverage poetry run coverage run -m pytest -q

      - name: Generate ephemeral Oracle password
        shell: bash
        run: |
          oracle_password="LdbCI_$(openssl rand -hex 16)"
          echo "::add-mask::$oracle_password"
          echo "ORACLE_PASSWORD=$oracle_password" >> "$GITHUB_ENV"
          echo "LDB_ORACLE_TEST_PASSWORD=$oracle_password" >> "$GITHUB_ENV"

      - name: Pull Oracle Free image
        shell: bash
        run: |
          started_at=$SECONDS
          docker pull "$ORACLE_IMAGE"
          echo "Oracle image pull: $((SECONDS - started_at)) seconds"
          docker image inspect "$ORACLE_IMAGE" --format 'Oracle image size: {{.Size}} bytes'
          df -h /

      - name: Start ephemeral Oracle
        shell: bash
        run: |
          started_at=$SECONDS
          docker run --detach --name limitsdb-oracle \
            --publish 1521:1521 \
            --env "ORACLE_PASSWORD=$ORACLE_PASSWORD" \
            "$ORACLE_IMAGE"
          echo "Oracle container launch: $((SECONDS - started_at)) seconds"

      - name: Wait for Oracle
        shell: bash
        run: |
          poetry run python - <<'PY'
          import os
          import time

          import oracledb

          deadline = time.monotonic() + 600
          last_error = None
          while time.monotonic() < deadline:
              try:
                  connection = oracledb.connect(
                      user=os.environ["LDB_ORACLE_TEST_USER"],
                      password=os.environ["LDB_ORACLE_TEST_PASSWORD"],
                      dsn=os.environ["LDB_ORACLE_TEST_DSN"],
                  )
                  connection.close()
                  print("Oracle is accepting connections")
                  break
              except oracledb.Error as exc:
                  last_error = exc
                  time.sleep(5)
          else:
              raise SystemExit(f"Oracle did not become ready within 600 seconds: {last_error}")
          PY

      - name: Report Oracle resources
        shell: bash
        run: |
          docker stats limitsdb-oracle --no-stream
          df -h /

      - name: Run Oracle integration tests with coverage
        shell: bash
        run: COVERAGE_FILE=.coverage-data/oracle/.coverage poetry run coverage run -m pytest -m oracle_integration -q

      - name: Build combined coverage report
        shell: bash
        run: |
          poetry run coverage combine .coverage-data/local .coverage-data/oracle
          poetry run coverage report -m | tee coverage.txt
          poetry run coverage xml -o coverage.xml
          poetry run coverage html -d htmlcov

          {
            echo "### Combined local and Oracle E2E coverage"
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-${{ github.run_id }}
          path: |
            .coverage
            coverage.txt
            coverage.xml
            htmlcov/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Show Oracle logs on failure
        if: failure()
        run: docker logs --tail 300 limitsdb-oracle

      - name: Remove ephemeral Oracle
        if: always()
        run: docker rm --force limitsdb-oracle || true
