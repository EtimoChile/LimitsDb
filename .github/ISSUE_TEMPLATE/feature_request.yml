name: Feature proposal
description: Propose an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before implementing large changes, please open an issue to discuss the
        proposal with the maintainers.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to achieve, and what is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: engine
    attributes:
      label: Affected database engine
      options:
        - Oracle
        - PostgreSQL
        - All engines
        - Not engine-specific
    validations:
      required: true
