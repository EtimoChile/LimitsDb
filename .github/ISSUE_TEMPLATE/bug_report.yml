name: Bug report
description: Report unexpected behavior in LimitsDb
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Do not paste real
        credentials, decrypted secrets, or production data.
  - type: input
    id: version
    attributes:
      label: LimitsDb version
      placeholder: "e.g. 0.10.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.4"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      options:
        - Oracle
        - PostgreSQL
        - Other / not engine-specific
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: Database engine version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      render: text
