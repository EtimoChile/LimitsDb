# Example connection settings for the GL test model (examples/postgresql/gl.sql).
# Passwords do not go here: they belong in secrets.json next to this file
# (source_password, history_password and, if used, the admin_* passwords).

db_engine: postgresql

# Runtime users. DSN format: host[:port]/database
source_dsn: "dbhost:5432/source_db"
source_username: ldb
history_dsn: "dbhost:5432/history_db"
history_username: ldbhst

# Administrative users, needed to provision users, roles and dblink
# (the admin of each database must be able to CREATE EXTENSION dblink)
# admin_source_username: postgres
# admin_history_username: postgres

# dblink connection names (source -> history and history -> source)
source_to_history_dblink_name: ldb_hist
history_to_source_dblink_name: ldb_src
