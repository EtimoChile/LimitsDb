default_language_version:
  python: python

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy strict
        entry: poetry run python -m mypy limitsdb
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: poetry run python -m pytest
        language: system
        pass_filenames: false
